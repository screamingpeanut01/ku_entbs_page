<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구 활동 | 엔터테인먼트경영연구센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="description" content="연구 프로젝트, 논문·출판, 세미나·포럼">
<meta property="og:type" content="website">
<meta property="og:title" content="연구 활동 | 엔터테인먼트경영연구센터">
<meta property="og:description" content="연구 프로젝트, 논문·출판, 세미나·포럼">
<meta property="og:site_name" content="Center for Entertainment Strategy and Management, Korea University">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="hero small">
  <div class="container">
    <span class="eyebrow">Research</span>
    <h1>연구 활동</h1>
    <p>연구 프로젝트 · 논문·출판 · 세미나·포럼</p>
  </div>
</section>

<section class="section">
  <div class="container" id="tabroot">
    <div class="tabs">
      <button class="active" data-panel="projects">연구 프로젝트</button>
      <button data-panel="publications">논문·출판</button>
      <button data-panel="seminars">세미나·포럼</button>
    </div>
    <div class="panel active" id="projects"><div class="grid c3" id="projects-list"></div></div>
    <div class="panel" id="publications"><div id="pub-list"></div></div>
    <div class="panel" id="seminars"><ul class="list" id="sem-list"></ul></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script>
window.render = function (S) {
  document.getElementById('projects-list').innerHTML = S.projects.map(p =>
    `<div class="card"><span class="tag">${p.period || ''}</span><span class="date">${p.sponsor || ''}</span><h3 style="margin-top:.5em">${p.title}</h3><p>${p.summary || ''}</p></div>`).join('');
  document.getElementById('pub-list').innerHTML = [...S.publications].sort((a, b) => b.year - a.year).map(p =>
    `<div class="pub"><span class="yr">${p.year}</span><span class="tag">${p.type}</span> ${p.authors}. ${p.link ? `<a href="${p.link}" target="_blank" rel="noopener"><strong>${p.title}</strong></a>` : `<strong>${p.title}</strong>`}. <span class="venue">${p.venue || ''}</span></div>`).join('');
  document.getElementById('sem-list').innerHTML = [...S.seminars].sort(byDateDesc).map(s =>
    `<li><span class="date">${fmtDate(s.date)}</span><div><a>${s.title}</a><div class="muted" style="font-size:.85rem">${[s.speaker, s.place].filter(Boolean).join(' · ')}</div></div></li>`).join('');
  tabs(document.getElementById('tabroot'));
};
</script>
<script src="assets/main.js"></script>
</body>
</html>
